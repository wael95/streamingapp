# Screening rules for Agent B ("what to buy").
# universe: sp500 | sp500_plus_watchlist | watchlist
# Conditions supported (metric + op + value):
#   market_cap, pe_ratio, avg_volume_30d, rsi_14, sma_cross,
#   price_vs_sma200, change_pct_5d, change_pct_1d, price
# Ops: ==, !=, >, >=, <, <=, between ([lo, hi])
# Tune freely — this is your starter set. Delete rules you don't want.

universe: sp500_plus_watchlist
lookback_days: 260
conditions:
  - {metric: avg_volume_30d,  op: ">=", value: 1000000}
  - {metric: price_vs_sma200, op: ">=", value: 1.0}
  - {metric: rsi_14,          op: "between", value: [30, 55]}
  # Uncomment to add fundamentals (slower, pulls from adapter):
  # - {metric: market_cap, op: ">=", value: 5000000000}
  # - {metric: pe_ratio,   op: "<=", value: 35}
max_results: 15
